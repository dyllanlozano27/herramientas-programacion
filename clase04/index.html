<section id="nueva">
  <h2>Agregar una tarea</h2>

<form>
  <label for="los dillan">Nombre:</label>
  <input type="text" id="los dillan" name="nombre" required>

  <label for="correo">Correo:</label>
  <input type="email" id="correo" name="correo" required>

  <label for="motivo">Motivo:</label>
  <select id="motivo" name="motivo">
    <option value="duda">Una duda</option>
    <option value="sugerencia">Una sugerencia</option>
    <option value="otro">Otro</option>
  </select>
   <label for="categoria">Categoría:</label>
    <select id="categoria" name="categoria">
      <option value="estudio">Estudio</option>
      <option value="casa">Casa</option>
      <option value="deporte">Deporte</option>
      <option value="otro">Otro</option>
    </select>
     <p>Estado:</p>
    <input type="radio" id="pendiente" name="estado" value="pendiente">
    <label for="pendiente">Pendiente</label>
    <input type="radio" id="completada" name="estado" value="completada">
    <label for="completada">Completada</label>
     <label for="fecha">Fecha:</label>
    <input type="date" id="fecha" name="fecha">

  <label for="mensaje">Mensaje:</label>
  <textarea id="mensaje" name="mensaje" required></textarea>

  <button type="submit">Enviar</button>
</form>

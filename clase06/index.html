<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dessigner Boss</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eee;
            text-align: center;
        }

        header, footer {
            background: black;
            color: white;
            padding: 20px;
        }

        .boton {
            background: white;

            padding: 10px;

        .ropa {

            width: 70%;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }

        .producto {
            display: inline-block;
            background: #eee;
            width: 180px;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Dessigner Boss</h1>
        <p>Tu estilo, tu forma de vestir</p>

        <a href="../../index.html" class="boton">
            Volver a mi portada
        </a>
    </header>

    <div class="ropa">
        <h2>Nuestra ropa</h2>

        <div class="producto">
            <h3>Camisetas</h3>
            <p>Diseños modernos y cómodos.</p>
        </div>

        <div class="producto">
            <h3>Pantalones</h3>
            <p>Estilo para cualquier ocasión.</p>
        </div>

        <div class="producto">
            <h3>Gorras</h3>
            <p>El complemento perfecto.</p>
        </div>
    </div>

    <footer>
        Dessigner Boss © 2026
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Designer Boss</title>

    <style>
        body {
            font-family: Arial;
            background-color: #111;
            color: white;
            text-align: center;
        }

        h1 {
            color: #a855f7;
        }

        .productos {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .producto {
            background-color: #222;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
        }

        .producto:hover {
            background-color: #333;
        }

        button {
            background-color: #a855f7;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>Designer Boss</h1>

    <p>Ropa con estilo para todos</p>

    <h2>Nuestros productos</h2>

    <div class="productos">

        <div class="producto">
            <h3>👕 Camisa</h3>
            <p>Camisa negra</p>
            <p>$60.000</p>
            <button>Comprar</button>
        </div>

        <div class="producto">
            <h3>👖 Pantalón</h3>
            <p>Pantalón clásico</p>
            <p>$90.000</p>
            <button>Comprar</button>
        </div>

        <div class="producto">
            <h3>🧢 Gorra</h3>
            <p>Gorra Designer</p>
            <p>$40.000</p>
            <button>Comprar</button>
        </div>

    </div>

    <br><br>

    <a href="index.html">← Volver al inicio</a>

</body>
</html>
